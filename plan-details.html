<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Plan Details — ForecastIQ</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<style>
:root {
  --bg:#03040a; --surface:#080c18; --card:#0b0f1e;
  --a1:#7c3aff; --a2:#06b6d4; --a3:#f0abfc; --a4:#34d399; --a5:#fb923c;
  --text:#f1f5f9; --muted:#64748b;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'JetBrains Mono',monospace;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

.bg-canvas{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:0.2;animation:drift 18s ease-in-out infinite alternate;}
.o1{width:700px;height:700px;background:radial-gradient(circle,#7c3aff,transparent 70%);top:-20%;left:-15%;}
.o2{width:500px;height:500px;background:radial-gradient(circle,#06b6d4,transparent 70%);bottom:-10%;right:-10%;animation-delay:-6s;}
@keyframes drift{0%{transform:translate(0,0) scale(1);}50%{transform:translate(25px,-20px) scale(1.05);}100%{transform:translate(-10px,35px) scale(0.95);}}
.scanlines{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.035) 2px,rgba(0,0,0,0.035) 4px);}

nav{display:flex;align-items:center;justify-content:space-between;padding:16px 36px;background:rgba(8,12,24,0.88);border-bottom:1px solid rgba(124,58,255,0.15);backdrop-filter:blur(24px);position:sticky;top:0;z-index:50;}
.nav-brand{display:flex;align-items:center;gap:12px;text-decoration:none;}
.nav-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.nav-back{font-size:11px;color:var(--muted);text-decoration:none;letter-spacing:.06em;}
.nav-back:hover{color:var(--text);}

main{position:relative;z-index:10;max-width:640px;margin:0 auto;padding:48px 24px 80px;}

.breadcrumb{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);letter-spacing:.05em;margin-bottom:28px;flex-wrap:wrap;}
.breadcrumb .sep{opacity:.4;}
.breadcrumb .current{color:var(--a3);}

#content { animation: fadeUp .5s cubic-bezier(.34,1.56,.64,1) both; }
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

.plan-card{background:linear-gradient(160deg,rgba(11,15,30,.97),rgba(8,12,24,.99));border:1px solid rgba(124,58,255,.25);border-radius:18px;padding:32px;}
.plan-eyebrow{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px;}
.plan-name{font-family:'Syne',sans-serif;font-size:30px;font-weight:800;margin-bottom:4px;}
.plan-price{font-size:24px;font-weight:700;opacity:.92;margin-bottom:10px;}
.plan-price small{font-size:12px;font-weight:400;opacity:.6;}
.plan-tagline{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:24px;}
.most-popular-badge{display:inline-block;background:linear-gradient(90deg,var(--a1),var(--a2));color:#fff;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 12px;border-radius:20px;margin-bottom:14px;}

.section-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);border-top:1px solid rgba(255,255,255,.08);padding-top:20px;margin-bottom:16px;}
.feature-row{display:flex;gap:12px;margin-bottom:18px;}
.feature-icon{flex-shrink:0;width:22px;height:22px;border-radius:6px;background:rgba(124,58,255,.12);color:var(--a3);display:flex;align-items:center;justify-content:center;font-size:12px;}
.feature-text .ft-title{font-size:13px;font-weight:600;margin-bottom:3px;}
.feature-text .ft-body{font-size:12px;color:var(--muted);line-height:1.6;}
.feature-text .ft-limit{color:var(--a4);font-weight:600;}

.trial-note{display:flex;gap:10px;align-items:flex-start;background:rgba(52,211,153,.06);border:1px solid rgba(52,211,153,.2);border-radius:10px;padding:12px 14px;margin:18px 0;font-size:12px;color:#a7f3d0;line-height:1.6;}

.cta-btn{width:100%;padding:15px;border-radius:12px;border:none;background:linear-gradient(90deg,var(--a1),var(--a2));color:#fff;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;letter-spacing:.04em;cursor:pointer;margin-top:8px;transition:opacity .2s,transform .15s;}
.cta-btn:hover{opacity:.92;transform:translateY(-1px);}
.cta-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.cta-secondary{width:100%;padding:12px;background:none;border:1px solid rgba(255,255,255,.1);border-radius:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.05em;cursor:pointer;margin-top:10px;}
.cta-secondary:hover{color:var(--text);border-color:rgba(255,255,255,.25);}

.status-msg{font-size:12px;margin-top:12px;text-align:center;}
.status-msg.err{color:#f87171;}
.status-msg.ok{color:var(--a4);}

.skeleton{opacity:.5;text-align:center;padding:60px 0;font-size:12px;color:var(--muted);}
.paymob-warn{font-size:11px;color:var(--a5);background:rgba(251,146,60,.08);border:1px solid rgba(251,146,60,.2);border-radius:8px;padding:10px 12px;margin-top:14px;line-height:1.6;}
</style>
</head>
<body>
<div class="bg-canvas"><div class="orb o1"></div><div class="orb o2"></div></div>
<div class="scanlines"></div>

<nav>
  <a class="nav-brand" href="/dashboard">
    <span class="nav-title">FORECASTIQ</span>
  </a>
  <a class="nav-back" href="/dashboard">← Back to Dashboard</a>
</nav>

<main>
  <div class="breadcrumb">
    <a href="/dashboard" style="color:var(--muted); text-decoration:none;">Pricing</a>
    <span class="sep">→</span>
    <span id="bc-plan">Select Plan</span>
    <span class="sep">→</span>
    <span class="current">Plan Details</span>
    <span class="sep">→</span>
    <span>Subscribe</span>
    <span class="sep">→</span>
    <span>Payment</span>
  </div>

  <div id="content">
    <div class="skeleton">Loading plan details...</div>
  </div>
</main>

<script>
// Auto-detects local vs deployed — same file works either way.
const API = new URLSearchParams(location.search).get("api") || location.origin;
const params = new URLSearchParams(location.search);
const PLAN_ID = params.get("plan");
const MODE = params.get("mode") === "trial" ? "trial" : "subscribe"; // default: subscribe

// ── Firebase init (same project as dashboard.html / login page) ────────────
firebase.initializeApp({
  apiKey:     "AIzaSyBTi0hycT_nCgThOoLDLDfXhCuLWeKcPMU",
  authDomain: "sales-forecasting-75f26.firebaseapp.com"
});
const auth = firebase.auth();

function isDevMode() { return !!localStorage.getItem("devPassword"); }

async function getAuthHeaders() {
  if (isDevMode()) return { "X-Dev-Password": localStorage.getItem("devPassword") };
  const user = auth.currentUser;
  if (!user) throw new Error("Not authenticated — please login first");
  const token = await user.getIdToken(false);
  return { Authorization: `Bearer ${token}` };
}

async function fetchWithTimeout(url, options = {}, ms = 10000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  try {
    const res = await fetch(url, { ...options, signal: controller.signal });
    clearTimeout(timer);
    return res;
  } catch (e) {
    clearTimeout(timer);
    if (e.name === 'AbortError') throw new Error('Request timed out — server may be busy. Try again.');
    throw e;
  }
}

// ── Auth guard — same pattern as dashboard.html: dev mode skips Firebase ───
let _ready = false;
function onAuthReady() {
  if (_ready) return;
  _ready = true;
  loadPlanDetails();
}
if (isDevMode()) {
  onAuthReady();
} else {
  auth.onAuthStateChanged(user => {
    if (!user) { window.location.replace(`/?next=/plan-details?${params.toString()}`); return; }
    onAuthReady();
  });
}

if (!PLAN_ID) {
  document.getElementById("content").innerHTML = `<div class="skeleton">No plan selected. <a href="/dashboard" style="color:var(--a3);">Go back to pricing</a>.</div>`;
  _ready = true; // stop the auth guard from also trying to load
}

async function loadPlanDetails() {
  if (!PLAN_ID) return;
  const content = document.getElementById("content");
  try {
    const headers = await getAuthHeaders().catch(() => ({}));
    const res = await fetchWithTimeout(`${API}/billing/plans`, { headers }, 10000);
    const d = await res.json();
    if (!res.ok) throw new Error(d.detail || res.statusText);

    const plan = d.plans.find(p => p.id === PLAN_ID);
    if (!plan) {
      content.innerHTML = `<div class="skeleton">Unknown plan "${PLAN_ID}". <a href="/dashboard" style="color:var(--a3);">Go back to pricing</a>.</div>`;
      return;
    }

    document.getElementById("bc-plan").textContent = plan.name;
    document.title = `${plan.name} — Plan Details — ForecastIQ`;

    const explain = d.feature_explanations || {};
    const trialAvailable = d.trial_available; // null if not logged in yet

    const rows = [
      explain.data_rows && { icon: "📄", t: explain.data_rows.title, b: explain.data_rows.body, limit: `${plan.max_data_rows_per_month.toLocaleString()} rows/month` },
      explain.trainings && { icon: "🏋️", t: explain.trainings.title, b: explain.trainings.body, limit: `${plan.max_trainings}/month` },
      explain.forecast_points && { icon: "🔮", t: explain.forecast_points.title, b: explain.forecast_points.body, limit: `${plan.max_forecast_points_per_month.toLocaleString()}/month` },
      explain.forecast_horizon && { icon: "📆", t: explain.forecast_horizon.title, b: explain.forecast_horizon.body, limit: `up to ${plan.max_forecast_months} months ahead` },
      explain.historical_data && { icon: "🗂️", t: explain.historical_data.title, b: explain.historical_data.body, limit: `up to ${plan.max_historical_months} months` },
      plan.product_level_forecasting && explain.product_level && { icon: "🏷️", t: explain.product_level.title, b: explain.product_level.body, limit: "included" },
      explain.dashboard && { icon: "📊", t: explain.dashboard.title, b: explain.dashboard.body, limit: "included" },
      explain.data_export && { icon: "⬇️", t: explain.data_export.title, b: explain.data_export.body, limit: "included" },
      plan.advanced_forecasting && explain.advanced_forecasting && { icon: "✨", t: explain.advanced_forecasting.title, b: explain.advanced_forecasting.body, limit: "included" },
    ].filter(Boolean).map(r => `
      <div class="feature-row">
        <div class="feature-icon">${r.icon}</div>
        <div class="feature-text">
          <div class="ft-title">${r.t}</div>
          <div class="ft-body">${r.b} <span class="ft-limit">(${r.limit})</span></div>
        </div>
      </div>
    `).join('');

    const isTrial = MODE === "trial" && trialAvailable !== false;
    const ctaLabel = isTrial
      ? `Start ${d.trial_duration_days}-day free trial — no card required`
      : `Subscribe to ${plan.name} — Continue to Payment`;

    content.innerHTML = `
      <div class="plan-card">
        ${plan.most_popular ? `<div class="most-popular-badge">Most Popular</div>` : ''}
        <div class="plan-eyebrow">Your Plan</div>
        <div class="plan-name">${plan.name}</div>
        <div class="plan-price">$${plan.price_usd}<small>/month</small></div>
        <div class="plan-tagline">${plan.tagline || ''}</div>

        <div class="section-label">What's included</div>
        ${rows}

        ${!isTrial ? `
        <div class="section-label" style="border-top:1px solid rgba(255,255,255,.08); padding-top:16px;">Where are you paying from?</div>
        <select id="country-select" style="width:100%; padding:12px; border-radius:10px; border:1px solid rgba(124,58,255,.3); background:#0b0f1e; color:var(--text); font-family:'JetBrains Mono',monospace; font-size:12px; margin-bottom:6px;">
          ${Object.keys(d.paymob_countries || {}).length === 0
            ? `<option value="">No countries configured yet</option>`
            : Object.entries(d.paymob_countries).map(([code, info]) =>
                `<option value="${code}">${info.label} (${info.currency})</option>`
              ).join('')
          }
        </select>
        <div id="gateway-warn"></div>
        ` : ''}

        ${MODE === "trial" && trialAvailable === false ? `
          <div class="paymob-warn">You've already used your free trial on this account — it's one trial per account, across all plans. Subscribe below to continue with ${plan.name}.</div>
        ` : ''}
        ${isTrial ? `
          <div class="trial-note">✓ ${d.trial_duration_days} days completely free, no credit card required. Limited to one free trial per account, across all plans.</div>
        ` : ''}

        <button class="cta-btn" id="cta-btn">${ctaLabel}</button>
        <button class="cta-secondary" onclick="window.location.href='/dashboard'">← Back to plans</button>
        <div class="status-msg" id="cta-status"></div>
      </div>
    `;

    // No countries configured at all -> disable the CTA outright instead
    // of letting the customer hit a guaranteed-to-fail request.
    if (!isTrial && Object.keys(d.paymob_countries || {}).length === 0) {
      const cta = document.getElementById('cta-btn');
      cta.disabled = true;
      document.getElementById('gateway-warn').innerHTML =
        `<div class="paymob-warn">⚠️ Payments aren't configured on the server yet for any country — add at least one PAYMOB_INTEGRATION_ID_&lt;COUNTRY&gt; to .env.</div>`;
    }

    document.getElementById("cta-btn").onclick = () => {
      if (isTrial) { doStartTrial(plan.id); return; }
      const country = document.getElementById('country-select').value;
      doSubscribe(plan.id, country);
    };
  } catch (e) {
    content.innerHTML = `<div class="skeleton" style="color:#f87171;">${e.message}</div>`;
  }
}

// The ONLY place that calls /billing/subscribe — reached exclusively by
// clicking the CTA on THIS page, after reading the plan details above and
// picking which Paymob country/currency integration to charge through.
async function doSubscribe(planId, country) {
  const btn = document.getElementById("cta-btn");
  const status = document.getElementById("cta-status");
  btn.disabled = true;
  status.className = "status-msg";
  status.textContent = "Starting checkout...";
  try {
    const headers = await getAuthHeaders();
    const res = await fetchWithTimeout(`${API}/billing/subscribe`, {
      method: 'POST',
      headers: { ...headers, 'Content-Type': 'application/json' },
      body: JSON.stringify({ plan_id: planId, country: country }),
    }, 15000);
    const d = await res.json();
    if (!res.ok) throw new Error(d.detail || res.statusText);

    // Opens the Paymob checkout iframe (for the chosen country/currency) in
    // a new tab — the payment system itself is untouched, this page only
    // decides WHEN + for WHICH country it's reached.
    window.open(d.checkout_url, '_blank');
    status.className = "status-msg ok";
    status.textContent = "Checkout opened in a new tab. After payment, your plan activates automatically — come back to the dashboard to see it.";
  } catch (e) {
    status.className = "status-msg err";
    status.textContent = "Couldn't start checkout: " + e.message;
  } finally {
    btn.disabled = false;
  }
}

// The ONLY place that calls /billing/start-trial — reached exclusively by
// clicking the CTA on THIS page. No card, no Paymob involved.
async function doStartTrial(planId) {
  const btn = document.getElementById("cta-btn");
  const status = document.getElementById("cta-status");
  btn.disabled = true;
  status.className = "status-msg";
  status.textContent = "Starting your trial...";
  try {
    const headers = await getAuthHeaders();
    const res = await fetchWithTimeout(`${API}/billing/start-trial`, {
      method: 'POST',
      headers: { ...headers, 'Content-Type': 'application/json' },
      body: JSON.stringify({ plan_id: planId }),
    }, 15000);
    const d = await res.json();
    if (!res.ok) throw new Error(d.detail || res.statusText);

    status.className = "status-msg ok";
    status.textContent = d.message + " Redirecting to your dashboard...";
    setTimeout(() => window.location.href = "/dashboard", 1500);
  } catch (e) {
    status.className = "status-msg err";
    status.textContent = "Couldn't start trial: " + e.message;
    btn.disabled = false;
  }
}
</script>
</body>
</html>
